[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox"
version = "0.1.0"
description = "BlackBox: learn how an unknown website behaves through black-box browser interaction"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "BlackBox research" }]
keywords = ["web-automation", "browser-agents", "behavioral-model", "playwright", "cdp", "research"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Software Development :: Testing",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "aiohttp>=3.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Screenshot fingerprinting (state similarity also works without it, using a
# content digest instead of a perceptual hash).
vision = ["Pillow>=10.0"]
# PostgreSQL persistence backend.
postgres = ["psycopg[binary]>=3.1"]
# The LLM provider abstraction. BlackBox is fully functional without it.
llm = ["openai>=1.30"]
# Preferred browser driver when it can be installed; the CDP driver is the
# dependency-free default.
playwright = ["playwright>=1.44"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
blackbox = "blackbox.agent.main:main"

[tool.setuptools.packages.find]
include = ["blackbox*"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["artifacts", "blackbox/dashboard", "blackbox/api/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PIE"]
ignore = [
  "E501",   # long lines are allowed where they aid readability of tables
  "B008",   # pydantic Field(...) in defaults is intentional
  "SIM108", # explicit if/else is often clearer in the agent logic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]
"tools/*" = ["T201"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "browser: launches Chromium",
  "e2e: drives the bundled demo websites",
]
